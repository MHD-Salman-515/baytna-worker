include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - "**/*.g.dart"
    - "**/*.config.dart"
    - "lib/core/localization/generated/**"
    - "build/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # App code, not a published package.
    public_member_api_docs: false
    # ARB keys are camelCase; generated l10n is excluded anyway.
    lines_longer_than_80_chars: false
    # Keep classic `ClassName(...)` constructors for readability.
    unnecessary_type_name_in_constructor: false
